<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistir Vídeo Renderizado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background:#000; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh;">

    <div style="width:100%; max-width:600px; padding:20px; text-align:center;">
        <h2 style="margin-bottom:15px; color:#00e676;">Seu Vídeo Está Pronto!</h2>
        <video id="main-player" controls autoplay style="width:100%; max-height:60vh; border-radius:8px; border:1px solid #333;"></video>
        
        <div style="margin-top:20px; display:flex; gap:10px;">
            <button onclick="window.location.href='/'" class="btn-secondary" style="flex:1;">⬅️ Voltar ao Editor</button>
            <button id="btn-download-now" class="btn-success" style="flex:1;">⬇️ Baixar Vídeo</button>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const videoFile = params.get('v');
        const player = document.getElementById('main-player');

        if (videoFile) {
            player.src = `/output/${videoFile}`;
        } else {
            alert('Vídeo não encontrado!');
            window.location.href = '/';
        }

        document.getElementById('btn-download-now').onclick = () => {
            const a = document.createElement('a');
            a.href = `/output/${videoFile}`;
            a.download = videoFile;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
    </script>
</body>
</html>
